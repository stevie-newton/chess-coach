services:
  - type: web
    name: chess-coach-backend
    runtime: docker
    dockerfilePath: ./chess-coach-backend/Dockerfile
    dockerContext: ./chess-coach-backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-coach-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      - key: STOCKFISH_DEPTH
        value: 12
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: BACKEND_CORS_ORIGINS
        sync: false

databases:
  - name: chess-coach-db
    plan: free
